<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Login MaDiGU</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

</head>

<body class="login-page">

  <div class="login-container">

    <div class="login-card">

      <img
        src="img/logo.png"
        alt="MaDiGu"
        class="login-logo"
      />

      <h1>Login MaDiGu</h1>

      <form id="loginForm">

        <div class="form-group">

          <input
            type="email"
            id="email"
            placeholder="Email"
            required
          />

        </div>

        <div class="form-group">

          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />

        </div>

        <button
          type="submit"
          class="login-btn"
        >

          <i class="fa-solid fa-right-to-bracket"></i>
          Masuk

        </button>

      </form>

    </div>

  </div>

  <script
    type="module"
    src="js/auth.js"
  ></script>

</body>
</html>
