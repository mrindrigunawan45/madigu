<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Dashboard MaDiGU</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</head>

<body>

  <!-- OVERLAY -->

  <div
    class="overlay"
    id="overlay"
  ></div>

  <!-- SIDEBAR -->

  <aside
    class="sidebar"
    id="sidebar"
  >

    <div class="sidebar-top">

      <div class="sidebar-logo">

        <img
          src="https://drive.google.com/thumbnail?id=1FWj7nowDdr3UFBKNbXxp4pOMQ2daCMKw&sz=w500"
        />

      </div>

    </div>

    <div class="sidebar-menu">

      <button onclick="showTab('jurnalTab')">

        <i class="fa-solid fa-book"></i>
        <span>Jurnal</span>

      </button>

      <button onclick="showTab('nilaiTab')">

        <i class="fa-solid fa-pen"></i>
        <span>Input Nilai</span>

      </button>

      <button onclick="showTab('rekapTab')">

        <i class="fa-solid fa-chart-line"></i>
        <span>Rekap Nilai</span>

      </button>

      <button onclick="showTab('rekapJurnalTab')">

        <i class="fa-solid fa-book-open"></i>
        <span>Rekap Jurnal</span>

      </button>

      <button onclick="showTab('rekapAbsenTab')">

        <i class="fa-solid fa-user-check"></i>
        <span>Rekap Absen</span>

      </button>

      
      <button id="logoutBtn">

        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Logout</span>

      </button>

    </div>

  </aside>

  <!-- CONTENT -->

  <div class="content-wrapper">

    <!-- HEADER -->

    <header>

      <div
        class="menu-btn"
        id="menuBtn"
      >

        <i class="fa-solid fa-bars"></i>

      </div>

      <div class="header-title">


        <!-- USER BOX -->

        <div class="guru-box">

  <div class="guru-item">

    <span id="welcomeText">

      Selamat Datang

    </span>

    <strong id="schoolText">

      MaDiGU

    </strong>

  </div>

</div>

    </header>

    <!-- MAIN -->

    <main>

      <!-- JURNAL -->

      <section
        class="tab active"
        id="jurnalTab"
      >

        <div class="card">

          <input
            type="date"
            id="tanggal"
          />

          <select id="mapel-jurnal">

            <option value="">
              Pilih Mata Pelajaran
            </option>

          </select>

          <select id="kelas-jurnal">

            <option value="">
              Pilih Kelas
            </option>

          </select>

          <textarea
            id="materi"
            placeholder="Materi Pembelajaran"
          ></textarea>

          <div id="list-siswa-jurnal"></div>

          <button id="saveJurnalBtn">

            Simpan Jurnal

          </button>

        </div>

      </section>

      <!-- INPUT NILAI -->

      <section
        class="tab"
        id="nilaiTab"
      >

        <div class="card">

          <select id="mapel-nilai">

            <option value="">
              Pilih Mata Pelajaran
            </option>

          </select>

          <select id="jenis-nilai">

            <option value="s1">S1</option>
            <option value="s2">S2</option>
            <option value="s3">S3</option>
            <option value="s4">S4</option>

            <option value="f1">F1</option>
            <option value="f2">F2</option>
            <option value="f3">F3</option>
            <option value="f4">F4</option>

            <option value="asts">ASTS</option>
            <option value="asas">ASAS</option>

          </select>

          <select id="kelas-nilai">

            <option value="">
              Pilih Kelas
            </option>

          </select>

          <div id="list-siswa-nilai"></div>

          <button id="saveNilaiBtn">

            Simpan Nilai

          </button>

        </div>

      </section>

      <!-- REKAP NILAI -->

      <section
        class="tab"
        id="rekapTab"
      >

        <div class="card">

          <select id="rekap-mapel">

            <option value="">
              Pilih Mata Pelajaran
            </option>

          </select>

          <select id="rekap-kelas">

            <option value="">
              Pilih Kelas
            </option>

          </select>

          <button id="downloadExcelBtn">

            Download Excel

          </button>

          <div class="table-container">

            <table id="rekap-table"></table>

          </div>

        </div>

      </section>

      <!-- REKAP JURNAL -->

      <section
        class="tab"
        id="rekapJurnalTab"
      >

        <div class="card">

          <select id="rekap-jurnal-mapel">

            <option value="">
              Pilih Mata Pelajaran
            </option>

          </select>

          <select id="rekap-jurnal-kelas">

            <option value="">
              Pilih Kelas
            </option>

          </select>

          <button id="downloadJurnalBtn">

            Download Excel

          </button>

          <div class="table-container">

            <table id="rekap-jurnal-table"></table>

          </div>

        </div>

      </section>

      <!-- REKAP ABSEN -->

      <section
        class="tab"
        id="rekapAbsenTab"
      >

        <div class="card">

          <select id="rekap-absen-kelas">

            <option value="">
              Pilih Kelas
            </option>

          </select>

          <button id="downloadAbsenBtn">

            Download Excel

          </button>

          <div id="rekap-absen-table"></div>

        </div>

      </section>

    </main>

  </div>

  <!-- SIDEBAR SCRIPT -->

  <script>

    const menuBtn =
      document.getElementById('menuBtn')

    const sidebar =
      document.getElementById('sidebar')

    const overlay =
      document.getElementById('overlay')

    menuBtn.onclick = () => {

      sidebar.classList.toggle('active')

      overlay.classList.toggle('active')

    }

    overlay.onclick = () => {

      sidebar.classList.remove('active')

      overlay.classList.remove('active')

    }

    function showTab(tabId) {

  // =========================
  // RESET REKAP NILAI
  // =========================

  const rekapTable =
    document.getElementById('rekap-table')

  if (rekapTable) {

    rekapTable.innerHTML = ''

  }

  // reset select
  const rekapMapel =
    document.getElementById('rekap-mapel')

  const rekapKelas =
    document.getElementById('rekap-kelas')

  if (rekapMapel) {
    rekapMapel.selectedIndex = 0
  }

  if (rekapKelas) {
    rekapKelas.selectedIndex = 0
  }

  // =========================
  // RESET REKAP JURNAL
  // =========================

  const rekapJurnalTable =
    document.getElementById('rekap-jurnal-table')

  if (rekapJurnalTable) {

    rekapJurnalTable.innerHTML = ''

  }

  const rekapJurnalMapel =
    document.getElementById('rekap-jurnal-mapel')

  const rekapJurnalKelas =
    document.getElementById('rekap-jurnal-kelas')

  if (rekapJurnalMapel) {
    rekapJurnalMapel.selectedIndex = 0
  }

  if (rekapJurnalKelas) {
    rekapJurnalKelas.selectedIndex = 0
  }

  // =========================
  // RESET REKAP ABSEN
  // =========================

  const rekapAbsenTable =
    document.getElementById('rekap-absen-table')

  if (rekapAbsenTable) {

    rekapAbsenTable.innerHTML = ''

  }

  const rekapAbsenKelas =
    document.getElementById('rekap-absen-kelas')

  if (rekapAbsenKelas) {

    rekapAbsenKelas.selectedIndex = 0

  }

  // =========================
  // TAB SWITCH
  // =========================

  document
    .querySelectorAll('.tab')
    .forEach(tab => {

      tab.classList.remove('active')

    })

  document
    .getElementById(tabId)
    .classList.add('active')

  // RESET ACTIVE MENU

document
  .querySelectorAll('.sidebar-menu button')
  .forEach(btn => {

    btn.classList.remove('active')

  })

// ACTIVE CURRENT MENU

const activeButton =
  document.querySelector(

    `[onclick="showTab('${tabId}')"]`

  )

if (activeButton) {

  activeButton.classList.add('active')

}
    sidebar.classList.remove('active')

  overlay.classList.remove('active')

}

  </script>

  
  <!-- MODULE -->

  <script
    type="module"
    src="js/auth.js"
  ></script>

  <script
    type="module"
    src="js/jurnal.js"
  ></script>

  <script
    type="module"
    src="js/nilai.js"
  ></script>

  <script
    type="module"
    src="js/rekapNilai.js"
  ></script>

  <script
    type="module"
    src="js/rekapJurnal.js"
  ></script>

  <script
    type="module"
    src="js/rekapAbsen.js"
  ></script>

  <script type="module">

import { supabaseClient }
from './js/supabase.js'

async function loadUserInfo() {

  // USER LOGIN
  const {
    data: { user }
  } = await supabaseClient.auth.getUser()

  if (!user) return

  // PROFILE
  const {
    data: profile,
    error
  } = await supabaseClient

    .from('profiles')

    .select('name, sekolah')

    .eq('email', user.email)

    .single()

  if (error || !profile) {

  console.log('PROFILE ERROR:', error)

  console.log('USER LOGIN:', user)

  console.log('PROFILE:', profile)

  return

}

  // TAMPILKAN
  document.getElementById(
    'welcomeText'
  ).innerText =

    `Selamat Datang, ${profile.name}`

  document.getElementById(
    'schoolText'
  ).innerText =

    profile.sekolah

}

loadUserInfo()

</script>

</script>

</body>

</html>
